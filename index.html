<style>
  .porta { min-height: 100vh; display: grid; place-items: center; padding: 48px var(--gutter); position: relative; overflow: hidden; }

  .portas a { display: grid; gap: 6px; padding: 22px 20px; text-decoration: none; border: 1px solid var(--linha); border-radius: 6px; background: var(--noir-2); text-align: left; transition: border-color .2s; }
  .portas a:hover { border-color: var(--ouro); }
  .portas b { font: 800 22px/1.2 var(--display); }
  .portas small { font: 500 11px/1.4 var(--mono); letter-spacing: .14em; text-transform: uppercase; }
  .portas .pt small { color: var(--ouro); }
  .portas .en small { color: #fff; }
